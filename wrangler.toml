name = "az-movies"
main = "router-v7.js"
compatibility_date = "2026-09-07"
keep_vars = true
# TMDB en worker.js. NSR usa exactamente el flujo original sources -> resolve en router-v7.js.
# Solo TMDB_API_KEY es obligatoria aquí; router-v7 no agrega autenticación extra a NSR.

[secrets]
required = ["TMDB_API_KEY"]
