name = "az-movies"
main = "router-v2.js"
compatibility_date = "2026-09-07"
keep_vars = true
# Flujo correcto: TMDB en worker.js y NSR directo en router-v2.js.
# NSR_API_TOKEN debe configurarse como secreto en Cloudflare; no se guarda en GitHub.

[secrets]
required = ["TMDB_API_KEY", "NSR_API_TOKEN"]
